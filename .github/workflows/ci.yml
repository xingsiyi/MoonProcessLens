name: MoonProcessLens check build test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain and dependencies
        run: |
          moon version --all
          moon update
      - name: Source scale, history and artifact hygiene
        run: |
          python3 scripts/verify_repository.py
          python3 -m unittest discover -s scripts -p 'test_native_artifact.py'
      - name: Check
        run: moon check --target all --deny-warn
      - name: Build
        run: moon build --target all --deny-warn
      - name: Test
        run: moon test --target all --deny-warn
      - name: Formatting and public interfaces
        run: |
          moon fmt --check
          moon info
          git diff --exit-code
      - name: Runnable workflows
        run: |
          moon run --target native --deny-warn examples/procurement
          moon run --target native --deny-warn examples/support
          moon run --target native --deny-warn examples/pipeline
          moon run --target native --deny-warn examples/repairs
          moon run --target native --deny-warn examples/security
          moon run --target native --deny-warn examples/orders
          moon run --target native --deny-warn examples/equipment
          moon run --target native --deny-warn examples/funnel
      - name: CLI workflows
        run: |
          moon run --target native --deny-warn cmd/processlens -- analyze examples/files/process-log.json
          moon run --target native --deny-warn cmd/processlens -- align examples/files/process-log.json examples/files/reference-paths.json
          moon run --target native --deny-warn cmd/sequence -- validate examples/files/program.json
          moon run --target native --deny-warn cmd/sequence -- run examples/files/program.json examples/files/events.ndjson
      - name: Benchmark smoke
        run: |
          moon run --target native --release --deny-warn examples/process_scale
          moon run --target native --release --deny-warn examples/performance
      - name: Model discovery, conformance and standard-log scenarios
        run: |
          moon run --target native --deny-warn examples/model_discovery
          moon run --target native --deny-warn examples/model_conformance
          moon run --target native --deny-warn examples/standard_workflow
          python3 scripts/verify_model_cli.py
      - name: Batch model-alignment equivalence workload
        run: moon run --target native --release --deny-warn examples/model_scale

  pm4py-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent reference and MoonBit
        run: |
          python -m pip install pm4py==2.7.23
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Prepare dependencies and compare finite supported profile
        run: |
          moon update
          moon check --target wasm-gc --deny-warn
          python scripts/compare_pm4py.py
