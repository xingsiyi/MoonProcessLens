name: Check build test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain and dependencies
        run: |
          moon version --all
          moon update
      - name: Source scale, history and artifact hygiene
        run: python3 scripts/verify_repository.py
      - name: Check
        run: moon check --target all --deny-warn
      - name: Build
        run: moon build --target all --deny-warn
      - name: Test
        run: moon test --target all --deny-warn
      - name: Formatting and public interfaces
        run: |
          moon fmt --check
          moon info
          git diff --exit-code
      - name: Runnable workflows
        run: |
          moon run --target native --deny-warn examples/security
          moon run --target native --deny-warn examples/orders
          moon run --target native --deny-warn examples/equipment
          moon run --target native --deny-warn examples/funnel
      - name: CLI workflows
        run: |
          moon run --target native --deny-warn cmd/mooncep -- validate examples/files/program.json
          moon run --target native --deny-warn cmd/mooncep -- run examples/files/program.json examples/files/events.ndjson
      - name: Benchmark smoke
        run: moon run --target native --release --deny-warn examples/performance
